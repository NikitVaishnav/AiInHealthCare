<!DOCTYPE html>
<html lang="en">
<head>
    <title>Health Blogs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e8edfb, #c5d4f5);
            font-family: 'DM Sans', sans-serif;
        }
        .card {
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="text-center mb-4">📝 Health Blogs</h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card p-3 mb-4">
                <h5>💧 Importance of Hydration</h5>
                <p>Drinking enough water keeps your body healthy and active.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 mb-4">
                <h5>🥗 Balanced Diet</h5>
                <p>Include proteins, vitamins, and minerals in daily meals.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 mb-4">
                <h5>🏃 Exercise Daily</h5>
                <p>30 minutes of exercise improves physical & mental health.</p>
            </div>
        </div>

    </div>

    <div class="text-center mt-4">
        <a href="/home" class="btn btn-primary">← Back to Home</a>
    </div>
</div>

</body>
</html>
