<!DOCTYPE html>
<html>
<head>
<title>Signup</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- paste common style here -->
</head>

<body>

<nav class="navbar p-3">
    <a href="#">Healthcare</a>
</nav>

<div class="container mt-5">
    <div class="col-md-5 mx-auto card p-4">
        <h3 class="text-center mb-3">Create Account</h3>

        <form method="post" action="/signup">
            <input name="name" class="form-control mb-2" placeholder="Name" required>
            <input name="age" type="number" class="form-control mb-2" placeholder="Age">
            <input name="gender" class="form-control mb-2" placeholder="Gender">
            <input name="blood" class="form-control mb-2" placeholder="Blood Group">
            <input name="email" type="email" class="form-control mb-2" placeholder="Email" required>
            <input name="password" type="password" class="form-control mb-2" placeholder="Password" required>
            <button class="btn btn-primary w-100">Signup</button>
        </form>
    </div>
</div>

</body>
</html>
