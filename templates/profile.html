<!DOCTYPE html>
<html>
<head>
<title>Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- paste common style here -->
</head>

<body>

<nav class="navbar p-3 d-flex justify-content-between">
    <a href="/home">Healthcare</a>
    <a href="/logout" class="btn btn-light">Logout</a>
</nav>

<div class="container mt-5">
    <div class="card p-4">
        <h3 class="mb-3">User Profile</h3>

        <ul class="list-group">
            <li class="list-group-item">Name: {{ user.name }}</li>
            <li class="list-group-item">Age: {{ user.age or 'Not provided' }}</li>
            <li class="list-group-item">Gender: {{ user.gender or 'Not provided' }}</li>
            <li class="list-group-item">Blood Group: {{ user.blood_group or 'Not provided' }}</li>
            <li class="list-group-item">Email: {{ user.email }}</li>
            <li class="list-group-item">Coins Earned: {{ user.user_points }}</li>
        </ul>
    </div>
</div>

</body>
</html>
